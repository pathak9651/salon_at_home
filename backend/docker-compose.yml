services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: salon_at_home
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - salon_at_home_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d salon_at_home"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  salon_at_home_data:
